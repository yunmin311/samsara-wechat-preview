name: Publish exhibition preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
          BASE_PATH: /samsara-wechat-preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this repository to its Pages site
        id: deployment
        uses: actions/deploy-pages@v4
