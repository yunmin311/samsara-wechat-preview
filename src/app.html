<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover lets the page draw under the notch/rounded
		     corners on phones; the screens that need clearance pad with
		     env(safe-area-inset-*) themselves. Without it, iOS letterboxes
		     landscape with white pillars either side of the footage. -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b141a" />
		<meta name="text-scale" content="scale" />
		<script>
			if (/Android/i.test(navigator.userAgent) && /MicroMessenger/i.test(navigator.userAgent) && typeof VideoDecoder !== 'undefined') {
				const opening = document.createElement('link');
				opening.rel = 'preload';
				opening.as = 'fetch';
				opening.crossOrigin = 'anonymous';
				opening.href = '%sveltekit.assets%/wechat/videos/1.mp4';
				document.head.append(opening);
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
